[package]
name = "fairlens"
version = "0.1.0"
description = "FairLens 桌面应用（Rust 薄层：仅系统能力宿主，业务逻辑零下沉——红线 <300 行，docs/01 §2.3）"
edition = "2021"

[lib]
name = "fairlens_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-log = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"  # M1.5: Ctrl+点击链接经系统浏览器打开（open_external 语义）
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 里程碑增量（按需解锁，勿提前引入）：
# M2: machine-uid（tauri-plugin-sql 已于 m1.6 解锁：本地持久层）
# M3: tauri-plugin-http
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
# 2026-11-13 #125：导出走「选路径（dialog）+ WebView2 PrintToPdf 直出文件」，不用系统打印对话框。
# dialog 的「另存为」与归档导出共用；PrintToPdf 需 webview2-com（wry 传递依赖，版本须与 tauri 2.12 对齐 0.39）。
tauri-plugin-dialog = "2"
webview2-com = "0.39"
windows-core = "0.62"
